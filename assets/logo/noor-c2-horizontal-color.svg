<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 64" role="img" aria-labelledby="noor-c2h-t noor-c2h-d">
  <title id="noor-c2h-t">شعار نور الأفقي — النجمة الثمانية</title>
  <desc id="noor-c2h-d">علامة النجمة الثمانية على اليمين وكلمة نور بالحبر على اليسار مع شريط تقدم (تخطيط RTL)</desc>
  <g id="icon-mark" transform="translate(112,0)">
    <g id="background">
      <rect x="3" y="3" width="58" height="58" rx="15" fill="#E6F4EA" stroke="#188038" stroke-width="3"/>
    </g>
    <g id="star">
      <rect x="19" y="19" width="26" height="26" fill="#188038"/>
      <rect x="19" y="19" width="26" height="26" fill="#34A853" transform="rotate(45 32 32)"/>
    </g>
    <g id="star-cutout">
      <rect x="25" y="25" width="14" height="14" fill="#FFFFFF"/>
      <rect x="25" y="25" width="14" height="14" fill="#FFFFFF" transform="rotate(45 32 32)"/>
    </g>
    <g id="star-core">
      <circle cx="32" cy="32" r="4" fill="#188038"/>
    </g>
  </g>
  <g id="wordmark">
    <text x="54" y="42" text-anchor="middle" font-family="Tahoma, 'Segoe UI', 'Noto Kufi Arabic', 'IBM Plex Sans Arabic', Arial, sans-serif" font-size="32" font-weight="700" fill="#202124">نور</text>
    <rect x="28" y="50" width="52" height="4" rx="2" fill="#E6F4EA"/>
    <rect x="28" y="50" width="32" height="4" rx="2" fill="#34A853"/>
  </g>
</svg>
